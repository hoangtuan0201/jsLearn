<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Title</title>
	<style>
		body {
			background-color: pink;

		}

	</style>
</head>
<body>
    <form action="" onsubmit="return myFunction()">
		FirstName:<input type="text" class="numb1" size="30">
		<br><br>
		LastName:<input type="text" class="numb2" size="30">
		<br><br>
		Year of Study<input type="text" class="numb3" size="30">
		<br><br>
		Department<input type="text" class="numb4" size="30">
		<br><br>
		Email ID<input type="text" class="numb5" size="30">
		<br><br>
		Location<input type="text" class="numb6" size="30">
		<br><br>
		Contact Number<input type="number" class="numb7" size="30">
		<br><br>
		<input type="submit" value="Submit" onclick="myFunction()">
	</form>
	<br><br>
	<p class="displayInfo"></p>

<script>
	function  myFunction() {
        var fname = document.querySelector('.numb1').value;
        var lname = document.querySelector('.numb2').value;
        var year = document.querySelector('.numb3').value;
        var department = document.querySelector('.numb4').value;
        var email = document.querySelector('.numb5').value;
        var location = document.querySelector('.numb6').value;
        var contact = document.querySelector('.numb7').value;


        if (fname === "" || lname === "" || year === "" || department === "" || email === "" || location === "" || contact === "") {
            alert("Please fill in all the fields.");
            return false;
        }
        document.body.style.background = "pink";

        document.querySelector('.displayInfo').innerHTML =
            `<strong>Submitted Information:</strong><br>
				First Name: ${fname}<br>
				Last Name: ${lname}<br>
				Year of Study: ${year}<br>
				Department: ${department}<br>
				Email ID: ${email}<br>
				Location: ${location}<br>
				Contact Number: ${contact}`;
        return false;

    }
</script>



</body>
</html>
